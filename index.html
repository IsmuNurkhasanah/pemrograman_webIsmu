<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>WebSocket</title>
</head>
<body>
    <h2>WebSocket Chat</h2>
    <input type="text" id="inputPesan" placeholder="Ketik pesan...">
    <button onclick="kirimPesan()">Kirim</button>
    <ul id="Pesan"></ul>

    <script>
        const socket = new WebSocket('ws://localhost:3000');

        socket.onopen = () => {
            console.log('Terhubung ke server websocket!');
        };

        socket.onmessage = (event) => {
            console.log('Pesan masuk:', event.data);
            const li = document.createElement('li');
            li.textContent = event.data;
            document.getElementById('Pesan').appendChild(li);
        };

        function kirimPesan() {
            const input = document.getElementById('inputPesan');
            if (input.value.trim() !== '') {
                console.log('Kirim Pesan:', input.value);
                socket.send(input.value.trim());
                input.value = '';
            }
        }

        document.getElementById('inputPesan').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                kirimPesan();
            }
        });
    </script>
</body>
</html>
